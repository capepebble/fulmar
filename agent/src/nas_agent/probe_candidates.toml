# Appels candidats pour la sonde de découverte (lecture seule), tirés de la carte de N4S4.
# La sonde refuse toute méthode qui n'est pas une lecture (voir probe.is_read_only).
# `max_version` absent : la plus haute version annoncée par le NAS.

[[call]]
api = "SYNO.DSM.Info"
method = "getinfo"

[[call]]
api = "SYNO.Core.System"
method = "info"

[[call]]
api = "SYNO.Core.System.Status"
method = "get"

[[call]]
api = "SYNO.Core.System.SystemHealth"
method = "get"

[[call]]
api = "SYNO.Core.System.Utilization"
method = "get"

[[call]]
api = "SYNO.Storage.CGI.Storage"
method = "load_info"

[[call]]
api = "SYNO.Core.Share"
method = "list"
params = { additional = '["encryption","recyclebin","share_quota","hidden","is_aclmode"]' }

# Instantanés : version 2, dossier par dossier, sans les instantanés cachés, comme l'interface.
[[call]]
api = "SYNO.Core.Share.Snapshot"
method = "list"
max_version = 2
params = { offset = 0, limit = -1, filter = '{"attr":["!hide==true"]}', additional = '["desc","lock","schedule_snapshot"]' }
each = { from = "SYNO.Core.Share.list", items = "shares", key = "name" }

[[call]]
api = "SYNO.Core.Share.Snapshot"
method = "get_schedule"
max_version = 1
each = { from = "SYNO.Core.Share.list", items = "shares", key = "name" }

# Hyper Backup : l'interface du paquet appelle SYNO.Backup.Task en version 1.
[[call]]
api = "SYNO.Backup.Task"
method = "list"
max_version = 1
params = { sort_by = "name", additional = '["last_bkp_time","next_bkp_time","last_bkp_result","is_modified","last_bkp_progress","get_source"]' }

[[call]]
api = "SYNO.Backup.Task"
method = "status"
max_version = 1
params = { blOnline = "false", additional = '["last_bkp_time","next_bkp_time","last_bkp_result","is_modified","last_bkp_progress"]' }
each = { from = "SYNO.Backup.Task.list", items = "task_list", key = "task_id" }

[[call]]
api = "SYNO.Backup.Task"
method = "get"
max_version = 1
each = { from = "SYNO.Backup.Task.list", items = "task_list", key = "task_id" }

[[call]]
api = "SYNO.Backup.Repository"
method = "list"
max_version = 1

[[call]]
api = "SYNO.SDS.Backup.Client.Common.Log"
method = "list"
params = { offset = 0, limit = 50 }

[[call]]
api = "SYNO.Backup.Version"
method = "list"
max_version = 2
params = { sort_direction = "desc", filter_name = "success" }
each = { from = "SYNO.Backup.Task.list", items = "task_list", key = "task_id" }

