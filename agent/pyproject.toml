[project]
name = "nas-agent"
version = "0.1.0"
description = "Agent installé sur un NAS Synology : API REST et serveur MCP en lecture, jetons à droits limités, journal chaîné."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "aiohttp>=3.14",
    "defusedxml>=0.7",
    "fastapi>=0.162",
    "mcp>=2.3,<3",
    "py-synologydsm-api>=2.11,<3",
    "pydantic>=2.14",
    "segno>=1.6",
    "uvicorn>=0.54",
]

[project.scripts]
nas-agent = "nas_agent.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]
[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nas_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S107", "E501"]
